<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissor</title>
    <link rel="stylesheet" href="style8.css">
</head>
<body>
    <div class="msg-winner hide">
        <div id="msg-w">winner is</div>
        <div> <button id="new-b">start new game</button></div>
    </div>
    
    <h1 id="head">Rock Paper Scissor</h1>
    <div class="choices">
         <div class="choice" id="scissor">
            <img src="scissorr.png" alt="">
         </div>
        <div class="choice" id="paper">
            <img src="pepar.pnh.png" alt="">
        </div>
        <div class="choice" id="rock">
            <img src="rrock.png" alt="">
        </div>
       
    </div>

    <div class="score-board">
        <div class="score">
            <p id="user-score">0</p>
            <p>you</p>
        </div>
    
     
        <div class="score">
            <p id="comp-score">0</p>
            <p>computer</p>
        </div>
       
     </div>
     <div id="win20">
        Reach 20 first and Win
     </div>

    <div class="msg-container">
        <p id="msg"> play your move </p>
    </div>
    <script src="secondproject.js"></script>
</body>
</html>
